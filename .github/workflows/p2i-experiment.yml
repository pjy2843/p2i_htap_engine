name: P2I Experiment Runner

on:
  workflow_dispatch: {}
  push:
    branches:
      - p2i/migration-fixes
  pull_request:
    branches:
      - p2i/migration-fixes

permissions:
  id-token: write
  contents: read

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (assume role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyspark boto3 psycopg2-binary pyarrow duckdb pyiceberg

      - name: Run migration dry-run
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Starting migration dry-run"
          python3 migration_improved.py

      - name: Collect migration_history (simple)
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
        run: |
          echo "=== migration_history ==="
          psql "${PG_DSN}" -c "SELECT relname, batch_id, status, iceberg_snapshot_id, s3_path, started_at, finished_at FROM migration_history ORDER BY started_at DESC LIMIT 20;"

      - name: Run small hybrid benchmark (optional)
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "Running small hybrid benchmark (short)"
          python3 bench/run_hybrid_benchmark.py